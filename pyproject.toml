[project]
name = "slipshod"
version = "0.1.0"
description = "Synthetic, deliberately messy insurance broking submissions with ground truth, for evaluating document-AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pillow>=10",
    "numpy>=1.26",
]

[project.scripts]
slipshod = "slipshod.cli:main"

[project.optional-dependencies]
app = [
    "gradio>=5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slipshod"]
